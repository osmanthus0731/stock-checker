{% extends "base.html" %}
{% block title %}Update Stock{% endblock %}

{% block content %}

<style>
/* Card */
.card {
  max-width: 720px;
  margin: 0 auto;
  background: #fff;
  border: 1px solid #e6e6f0;
  border-radius: 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,.04);
  padding: 16px;
}
/* Head */
.hd { margin: 0 0 12px; font-weight: 700; letter-spacing: .2px; }

/* Table */
.table-wrap { border: 1px solid #e6e6f0; border-radius: 12px; overflow: hidden; }
.table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; }
.table thead th {
  background: #f5f5f7; color: #2b2b2b; text-align: left;
  padding: 12px 14px; border-bottom: 1px solid #e6e6f0;
}
.table tbody td {
  padding: 12px 14px; border-bottom: 1px solid #f0f0f6; vertical-align: middle;
}
.table tbody tr:nth-child(odd)  { background: #ffffff; }
.table tbody tr:nth-child(even) { background: #fafbff; }
.table tbody tr:hover { background: #eef4ff; }

/* Inputs */
.qty-input, .loc-input {
  width: 120px; padding: 8px 10px; border: 1px solid #d9d9e3; border-radius: 8px;
  background: #fff; font-size: 14px;
}
.loc-input { width: 160px; }

/* Buttons */
.actions { display:flex; gap:10px; align-items:center; margin-top:14px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  height: 36px; padding: 0 14px; border-radius: 999px; font-weight: 600;
  font-size: 13px; cursor: pointer; border: 1px solid transparent; text-decoration: none;
}
.btn-primary { background: #0ea5e9; color: #fff; border-color:#0ea5e9; }
.btn-primary:hover { filter: brightness(.96); }
.btn-ghost   { background:#fff; color:#1f2937; border:1px solid #e4e4ed; }
.btn-ghost:hover { background:#f5f5fb; }
.link-back { color:#0a66c2; text-decoration:none; }
.link-back:hover { text-decoration:underline; }
</style>

<div class="card">
  <h2 class="hd">Update Stock — {{ product.name }} <span style="color:#6b7280;">({{ product.uid }})</span></h2>

  <form method="POST">
    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th style="width: 45%;">Location</th>
            <th style="width: 25%;">Current Qty</th>
            <th style="width: 30%;">New Qty</th>
          </tr>
        </thead>
        <tbody>
          {% for loc in product.locations %}
          <tr>
            <!-- 🔹 Make location editable -->
            <td>
              <input
                class="loc-input"
                type="text"
                name="area_{{ loop.index0 }}"
                value="{{ loc.area }}"
                required
              />
            </td>

            <td>{{ loc.quantity }}</td>

            <td>
              <input
                class="qty-input"
                type="number"
                name="quantity_{{ loop.index0 }}"
                value="{{ loc.quantity }}"
                min="0"
                step="1"
                required
              />
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>

    <div class="actions">
      <button type="submit" class="btn btn-primary">Save Changes</button>
      <a
        class="btn btn-ghost"
        href="{% if session['role'] == 'admin' %}{{ url_for('admin_dashboard') }}{% else %}{{ url_for('index') }}{% endif %}"
      >Cancel</a>
    </div>
  </form>

  <div style="margin-top:10px;">
    <a class="link-back" href="{% if session['role'] == 'admin' %}{{ url_for('admin_dashboard') }}{% else %}{{ url_for('index') }}{% endif %}">
      ← Back to Dashboard
    </a>
  </div>
</div>

{% endblock %}
